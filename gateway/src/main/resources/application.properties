spring.application.name=gateway

# Routes. identity- and rental-service each own their /api/v1 prefix, so we
# forward without stripping. Only auth is added here for now; everything else
# stays as-is (the gateway is the sole public entry point).

spring.cloud.gateway.server.webmvc.routes[0].id=identity-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=${ROUTE_IDENTITY:http://identity-service:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=rental-bookings
spring.cloud.gateway.server.webmvc.routes[1].uri=${ROUTE_RENTAL:http://rental-service:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/bookings/**

spring.cloud.gateway.server.webmvc.routes[2].id=rental-payments
spring.cloud.gateway.server.webmvc.routes[2].uri=${ROUTE_RENTAL:http://rental-service:8082}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/payments/**

spring.cloud.gateway.server.webmvc.routes[3].id=rental-shops
spring.cloud.gateway.server.webmvc.routes[3].uri=${ROUTE_RENTAL:http://rental-service:8082}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/shops/**

spring.cloud.gateway.server.webmvc.routes[4].id=rental-search
spring.cloud.gateway.server.webmvc.routes[4].uri=${ROUTE_RENTAL:http://rental-service:8082}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/search/**

